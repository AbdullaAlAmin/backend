trigger:
- master

pool:
  vmImage: 'ubuntu-latest'

steps:
- task: UseNode@1
  inputs:
    version: '22.x'
  displayName: 'Install Node.js'

- script: npm ci
  displayName: 'Install dependencies'

- script: node --check server.js
  displayName: 'Check JavaScript syntax'

- bash: |
    set -euo pipefail

    node server.js > server.log 2>&1 &
    api_pid=$!
    trap 'cat server.log; kill "$api_pid" 2>/dev/null || true' EXIT

    curl --fail --silent --show-error \
      --retry 15 --retry-connrefused \
      --retry-delay 1 --max-time 5 \
      http://127.0.0.1:3000/api/test > response.json

    node -e "const assert = require('node:assert/strict'); const data = require('./response.json'); assert.equal(data.message, 'Backend is working'); console.log('PASS: Backend API responded correctly');"
  displayName: 'Verify backend API'trigger:
